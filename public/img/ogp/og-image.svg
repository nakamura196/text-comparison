<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="800" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="64" font-weight="700" letter-spacing="-1">IIIF Text Comparison Tool</text>
  <text x="600" y="255" text-anchor="middle" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="36" font-weight="400" opacity="0.8">テキスト比較ツール</text>

  <!-- Three feature cards -->
  <!-- Card 1: Image -->
  <g transform="translate(165, 310)">
    <rect width="240" height="180" rx="16" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="80" y="24" width="80" height="56" rx="8" fill="white" opacity="0.2"/>
    <rect x="88" y="32" width="28" height="40" rx="4" fill="white" opacity="0.3"/>
    <rect x="124" y="32" width="28" height="40" rx="4" fill="white" opacity="0.3"/>
    <text x="120" y="120" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="22" font-weight="600">Image</text>
    <text x="120" y="150" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="15" opacity="0.7">Side-by-side viewer</text>
  </g>

  <!-- Card 2: Diff -->
  <g transform="translate(480, 310)">
    <rect width="240" height="180" rx="16" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(72, 20)">
      <rect x="0" y="8" width="96" height="12" rx="3" fill="#EAF2C2" opacity="0.6"/>
      <rect x="0" y="24" width="72" height="12" rx="3" fill="#FADAD7" opacity="0.6"/>
      <rect x="0" y="40" width="84" height="12" rx="3" fill="white" opacity="0.3"/>
    </g>
    <text x="120" y="120" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="22" font-weight="600">Text Diff</text>
    <text x="120" y="150" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="15" opacity="0.7">Character-level diff</text>
  </g>

  <!-- Card 3: Edit Distance -->
  <g transform="translate(795, 310)">
    <rect width="240" height="180" rx="16" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
    <g transform="translate(60, 18)">
      <!-- Network nodes -->
      <circle cx="20" cy="16" r="6" fill="white" opacity="0.4"/>
      <circle cx="20" cy="40" r="6" fill="white" opacity="0.4"/>
      <circle cx="100" cy="20" r="6" fill="white" opacity="0.4"/>
      <circle cx="100" cy="44" r="6" fill="white" opacity="0.4"/>
      <!-- Edges -->
      <line x1="26" y1="16" x2="94" y2="20" stroke="#60A5FA" stroke-width="2" opacity="0.7"/>
      <line x1="26" y1="40" x2="94" y2="44" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
      <line x1="26" y1="16" x2="94" y2="44" stroke="#60A5FA" stroke-width="1" opacity="0.3"/>
    </g>
    <text x="120" y="120" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="22" font-weight="600">Edit Distance</text>
    <text x="120" y="150" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="15" opacity="0.7">Network visualization</text>
  </g>

  <!-- IIIF badge -->
  <rect x="530" y="560" width="140" height="36" rx="18" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="584" text-anchor="middle" fill="white" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" opacity="0.9">IIIF Compatible</text>
</svg>
